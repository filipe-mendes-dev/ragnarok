[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ragnarok-ingestion"
version = "0.1.0"
description = "Document ingestion for RAGnarok"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["langchain-text-splitters==1.1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
