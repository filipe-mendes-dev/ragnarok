[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ragnarok-ingestion"
version = "0.1.0"
description = "Document ingestion for RAGnarok"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aio-pika>=9.5,<10",
    "boto3>=1.43.98",
    "fastapi>=0.141.1",
    "fastembed==0.8.0",
    "huggingface-hub>=0.20,<2",
    "langchain-text-splitters==1.1.2",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13,<3",
    "pypdf>=6.19,<7",
    "tokenizers>=0.15,<1",
    "uvicorn>=0.53.0",
]

[project.scripts]
worker = "ragnarok_ingestion.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "testcontainers[postgres]>=4.15.0",
]
